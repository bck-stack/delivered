name = "delivered-evaluator"
main = "worker.ts"
account_id = "8c67f51d9b44398f2ab031fb2a4db4e4"
compatibility_date = "2024-09-23"
workers_dev = true

# Cron: run every minute
[triggers]
crons = ["* * * * *"]

# KV namespace — create with:
#   wrangler kv:namespace create EVALUATIONS
# then replace the placeholder id below.
[[kv_namespaces]]
binding = "EVALUATIONS"
id = "138d6231360348ce84e7867067dac767"

# Arc mainnet (the Arc Testnet run used KV 2e8cfb1b0ab14251b48bdc8b76af1ece and the defaults in worker.ts)
[vars]
CHAIN_ID         = "5042"
RPC_URL          = "https://rpc.mainnet.arc.io"
CONTRACT_ADDRESS = "0x6f721eb4f16a972e9d77e4a57fd5324e513476a9"
GATEWAY_URL      = "https://delivered.chainmarket-api.workers.dev"

# Secrets (set with `wrangler secret put EVALUATOR_KEY`)
# EVALUATOR_KEY — private key of the evaluator wallet — never commit this value
